# Build the static site and publish it to GitHub Pages.
#
# The app has no backend, so "deploy" is just uploading dist/. Nothing in this
# workflow needs a secret: the zone and catalogue JSON are committed, so the build
# reaches no network beyond npm.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Build
        # BASE_PATH must match the repo name for a project Pages site
        # (tombo1001.github.io/carsearch/). A custom domain would set it to '/'.
        env:
          BASE_PATH: /carsearch/
          # Set these as repository variables to move off OSM's tile servers,
          # which do not permit a public site. See docs/deploying.md.
          VITE_TILE_URL: ${{ vars.VITE_TILE_URL }}
          VITE_TILE_ATTRIBUTION: ${{ vars.VITE_TILE_ATTRIBUTION }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
