# Weekly check that zone and vehicle data are still current.
#
# Runs scripts/check-data.mjs --apply, then:
#   - data files changed   -> opens (or refreshes) one pull request from
#                             automation/data-refresh, with the report as its
#                             description. Merging it is the act of review.
#   - nothing changed, but
#     something needs a person
#     (a dead link, stale charges)
#                          -> opens (or refreshes) one issue.
#   - all clear            -> closes that issue if it is open.
#
# It never pushes to main and never edits charges: those live as prose on council
# pages and need a person to read the diff. See docs/data.md.
#
# Opening the pull request needs "Allow GitHub Actions to create and approve pull
# requests" (Settings -> Actions -> General). Without it the branch is still pushed
# and the issue links to it instead.
name: Data check

on:
  schedule:
    # Mondays 06:23 UTC. Off the hour, because on-the-hour cron slots are the
    # busiest on GitHub's side and the most likely to be delayed or dropped.
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: data-check
  cancel-in-progress: false

env:
  BRANCH: automation/data-refresh
  ISSUE_TITLE: Data check needs review

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Check data
        id: check
        run: node scripts/check-data.mjs --apply

      - name: Prepare report
        run: |
          # GitHub rejects issue and PR bodies over 65,536 characters.
          if [ "$(wc -c < tmp/data-check.md)" -gt 60000 ]; then
            head -c 60000 tmp/data-check.md > tmp/body.md
            printf '\n\n... report truncated; the full version is in the workflow log.\n' >> tmp/body.md
          else
            cp tmp/data-check.md tmp/body.md
          fi
          cat tmp/body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW: ${{ steps.check.outputs.review }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          existing_issue=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')

          if git diff --quiet; then
            echo "No data files changed."
            if [ "$REVIEW" = "true" ]; then
              if [ -n "$existing_issue" ]; then
                gh issue edit "$existing_issue" --body-file tmp/body.md
              else
                gh issue create --title "$ISSUE_TITLE" --body-file tmp/body.md
              fi
            elif [ -n "$existing_issue" ]; then
              gh issue close "$existing_issue" --comment "Data check on $(date -u +%F) is all clear."
            fi
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add public/data data/watch
          git commit -m "Data refresh $(date -u +%F)" -m "Generated by the weekly data check. See the pull request description for what changed and what needs review."
          git push --force origin "$BRANCH"

          title="Data refresh $(date -u +%F)"
          existing_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "$title" --body-file tmp/body.md
          elif ! gh pr create --base main --head "$BRANCH" --title "$title" --body-file tmp/body.md; then
            # Most likely the repo does not allow Actions to open pull requests.
            printf '\n\n**Could not open a pull request automatically.** Review and merge the changes here: %s/compare/main...%s\n' \
              "$REPO_URL" "$BRANCH" >> tmp/body.md
            if [ -n "$existing_issue" ]; then
              gh issue edit "$existing_issue" --body-file tmp/body.md
            else
              gh issue create --title "$ISSUE_TITLE" --body-file tmp/body.md
            fi
          fi
