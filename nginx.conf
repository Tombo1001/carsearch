server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/geo+json;

    # Hashed bundles are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The zone and catalogue data are regenerated by a rebuild, not a redeploy of
    # the same image, so a short cache keeps refreshes honest.
    location /data/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Single-page app: unknown paths fall back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app never posts anywhere, so it does not need to be framed or embedded.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Not "no-referrer": OSM's tile servers identify callers by the Referer
    # header, and serve an "access blocked" tile to requests that arrive without
    # one. This sends the bare origin cross-site (no path, no query, and nothing
    # at all on an https -> http downgrade), which is enough for the tiles and
    # leaks no more than the browser default would.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
